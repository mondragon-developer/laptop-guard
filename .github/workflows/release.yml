name: Release packages

on:
  push:
    branches: ['release/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to rebuild/check; blank only builds this branch'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            architecture: x64
          - runner: macos-15
            target: macos-apple-silicon
            architecture: arm64
          - runner: macos-15-intel
            target: macos-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Test without input hooks or a real camera
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller laptop_guard.spec --clean --noconfirm
      - name: Check and package isolated application
        run: python tools/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: laptop-guard-${{ matrix.target }}
          path: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Preserve existing release or create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 tools/ensure_release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG"
